name: Canonical Integrity Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  canonical-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Validate Schema Integrity
        run: |
          python -m pytest tests/canonical/ -v --tb=short

      - name: Run Canonical Tester (via protocol)
        run: |
          python -c "
          from src.protocols.canonical_tester import run_all_canons
          exit_code = run_all_canons(verbose=True)
          exit(exit_code)
          "

      - name: Check License & Covenant Compliance
        run: |
          python -m pytest tests/compliance/ -v

      - name: Jurisdictional Refusal Smoke Test
        run: |
          python -m pytest tests/jurisdictional/ -v --tb=short

      - name: Fail if Any Canon Violated
        if: failure()
        run: |
          echo "::error::Canonical integrity check failed. Synthetic subject integrity compromised."
          exit 1